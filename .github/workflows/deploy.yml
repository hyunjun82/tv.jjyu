name: deploy

# quiz.jjyu 와 같은 흐름: GitHub Actions 에서 next build → wrangler deploy → IndexNow 핑.
# (Cloudflare 빌드 분을 쓰지 않고, 배포 직후 네이버에 새 페이지를 바로 알린다 — quiz 가 가장 빨리 노출된 구조)
#
# 준비(한 번만): 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (quiz.jjyu 와 같은 값)
# Cloudflare 쪽 Git 자동 빌드는 연결하지 않는다(이중 빌드 방지).

on:
  push:
    branches: [main]
    paths:
      - 'data/programs/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = 항상 빌드·배포 / food = 새 맛집 페이지가 있을 때만 배포'
        default: full
  # 방송이 끝나고 10분 뒤 수집·발행한다 (종료 시각 = 공식 편성표: KBS mediafactory 편성 시작+분량, SBS 편성표).
  #   6시 내고향 평일 18:00~19:00 · 생방송 투데이 평일 18:10~19:00 → 19:10
  #   생생정보 평일 18:35~19:50 → 20:00 / 한국인의 밥상 목 19:40~20:30 → 20:40
  #   동네 한 바퀴 토 19:10~20:05 → 20:15 / 생활의 달인 월 21:00~22:00 → 22:10
  # 각 30분 뒤 한 번 더 확인한다(GitHub 예약 실행이 건너뛰거나 방송정보 게시가 늦을 때 대비). 시각은 UTC = KST-9.
  schedule:
    - cron: '13 0,3,6,9 * * *'   # 기존 전체 빌드(안전망)
    - cron: '10,40 10 * * 1-5'   # 평일 19:10·19:40  6시 내고향 · 생방송 투데이
    - cron: '0,30 11 * * 1-5'    # 평일 20:00·20:30  생생정보
    - cron: '40 11 * * 4'        # 목 20:40          한국인의 밥상
    - cron: '10 12 * * 4'        # 목 21:10          한국인의 밥상 재확인
    - cron: '15,45 11 * * 6'     # 토 20:15·20:45    동네 한 바퀴
    - cron: '10,40 13 * * 1'     # 월 22:10·22:40    생활의 달인

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: 방송 맛집 자동 수집 (SBS 생방송 투데이·생활의 달인, KBS 생생정보·6시 내고향·동네 한바퀴·한국인의 밥상 — 공식 데이터만)
        continue-on-error: true
        run: |
          pip install --quiet 'pillow>=11.2' || true
          python3 scripts/collect_shows.py --days 7
          python3 scripts/build_place.py
      - name: 새 페이지 커밋
        id: commit
        continue-on-error: true
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          # 빌드·배포 여부: push, 수동 실행(full), 안전망 예약은 항상 / 맛집 확인 실행은 새 페이지가 있을 때만
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.schedule }}" = "13 0,3,6,9 * * *" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "food" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "tvday-bot"
          git config user.email "tvday-bot@users.noreply.github.com"
          git add data/programs public/img
          if git diff --cached --quiet; then echo "새 페이지 없음"; exit 0; fi
          git commit -m "자동 수집: 방송 맛집 $(TZ=Asia/Seoul date '+%F %H:%M') KST"
          git pull --rebase --quiet origin main && git push origin HEAD:main && { echo "changed=true"; echo "build=true"; } >> "$GITHUB_OUTPUT"
      - name: 발행 점검
        if: steps.commit.outputs.build == 'true'
        run: node scripts/verify.mjs
      - name: 빌드 (next build → out/)
        if: steps.commit.outputs.build == 'true'
        run: npm run build
      - name: 배포 (wrangler deploy)
        if: steps.commit.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜀 (빌드는 성공)"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          echo "배포 완료: $(TZ=Asia/Seoul date '+%F %H:%M') KST"
      - name: IndexNow 핑 (배포 직후)
        if: success() && steps.commit.outputs.build == 'true'
        continue-on-error: true
        run: bash scripts/indexnow-ping.sh
