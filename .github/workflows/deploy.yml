name: deploy

# quiz.jjyu 와 같은 흐름: GitHub Actions 에서 next build → wrangler deploy → IndexNow 핑.
# (Cloudflare 빌드 분을 쓰지 않고, 배포 직후 네이버에 새 페이지를 바로 알린다 — quiz 가 가장 빨리 노출된 구조)
#
# 준비(한 번만): 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (quiz.jjyu 와 같은 값)
# Cloudflare 쪽 Git 자동 빌드는 연결하지 않는다(이중 빌드 방지).

on:
  push:
    branches: [main]
    paths:
      - 'data/programs/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}
  # 안전망: 공연 데이터는 퀴즈처럼 매시간 바뀌지 않으므로 하루 4번이면 충분하다 — KST 09·12·15·18시 (UTC 0·3·6·9).
  schedule:
    - cron: '0 0,3,6,9 * * *'
    # 방송 맛집 자동 수집 (KST): 생방송 투데이 방송정보는 보통 16~17시에 올라오고, 생생정보는 18:35 방송,
    # 생활의 달인(월) 방송정보는 21시 이후에 올라온다 → 평일 17:20·18:40·19:50, 월요일 22:10·23:30
    - cron: '20 8 * * 1-5'
    - cron: '40 9 * * 1-5'
    - cron: '50 10 * * 1-5'
    - cron: '10 13 * * 1'
    - cron: '30 14 * * 1'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: 방송 맛집 자동 수집 (SBS 생방송 투데이·생활의 달인, KBS 생생정보 — 공식 데이터만)
        continue-on-error: true
        run: |
          pip install --quiet 'pillow>=11.2' || true
          python3 scripts/collect_shows.py --days 7
      - name: 새 페이지 커밋
        continue-on-error: true
        run: |
          git config user.name "tvday-bot"
          git config user.email "tvday-bot@users.noreply.github.com"
          git add data/programs public/img
          if git diff --cached --quiet; then echo "새 페이지 없음"; exit 0; fi
          git commit -m "자동 수집: 방송 맛집 $(TZ=Asia/Seoul date '+%F %H:%M') KST"
          git pull --rebase --quiet origin main && git push origin HEAD:main
      - name: 발행 점검
        run: node scripts/verify.mjs
      - name: 빌드 (next build → out/)
        run: npm run build
      - name: 배포 (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜀 (빌드는 성공)"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          echo "배포 완료: $(TZ=Asia/Seoul date '+%F %H:%M') KST"
      - name: IndexNow 핑 (배포 직후)
        if: success()
        continue-on-error: true
        run: bash scripts/indexnow-ping.sh
